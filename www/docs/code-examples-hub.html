  <script>
    // Global language preference
    let currentLanguage = 'javascript';

    // Set language preference
    function setLanguage(lang, clickedButton) {
      currentLanguage = lang;

      // Update language selector buttons
      document.querySelectorAll('.language-selector button').forEach(btn => {
        btn.classList.remove('active');
      });
      if (clickedButton) {
        clickedButton.classList.add('active');
      }

      // Update all example tabs
      document.querySelectorAll('.example-card').forEach(card => {
        switchTab(card, lang);
      });

      // Save preference
      localStorage.setItem('worksona-preferred-language', lang);
    }

    // Switch tab for a specific card
    function switchTab(card, lang) {
      // Hide all tabs
      card.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      // Deactivate all tab buttons
      card.querySelectorAll('.tab-buttons button').forEach(btn => {
        btn.classList.remove('active');
      });

      // Show selected tab
      const targetTab = card.querySelector(`.tab-${lang}`);
      if (targetTab) {
        targetTab.classList.add('active');
      }

      // Activate selected button
      const targetBtn = card.querySelector(`.tab-btn-${lang}`);
      if (targetBtn) {
        targetBtn.classList.add('active');
      }
    }

    // Copy code to clipboard
    function copyCode(button) {
      const codeBlock = button.nextElementSibling.querySelector('code');
      const text = codeBlock.textContent;

      navigator.clipboard.writeText(text).then(() => {
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        button.classList.add('copied');

        setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove('copied');
        }, 2000);
      });
    }

    // Search examples
    function searchExamples() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const examples = document.querySelectorAll('.example-card');
      let visibleCount = 0;

      examples.forEach(example => {
        const keywords = example.dataset.keywords || '';
        const text = example.textContent.toLowerCase();
        const matches = keywords.includes(searchTerm) || text.includes(searchTerm);

        example.style.display = matches ? 'block' : 'none';
        if (matches) visibleCount++;
      });

      // Show/hide no results message
      document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    }

    // Clear search
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchExamples();
    }

    // Update sidebar active state
    function updateSidebarActive() {
      const sections = document.querySelectorAll('section');
      const navLinks = document.querySelectorAll('.category-item a');

      let currentSection = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        if (window.scrollY >= sectionTop - 200) {
          currentSection = section.getAttribute('id');
        }
      });

      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === `#${currentSection}`) {
          link.classList.add('active');
        }
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Load saved language preference
      const savedLang = localStorage.getItem('worksona-preferred-language');
      if (savedLang) {
        currentLanguage = savedLang;
        document.querySelectorAll('.language-selector button').forEach(btn => {
          btn.classList.remove('active');
          if (btn.textContent.toLowerCase().includes(savedLang)) {
            btn.classList.add('active');
          }
        });

        // Apply to all cards
        document.querySelectorAll('.example-card').forEach(card => {
          switchTab(card, savedLang);
        });
      }

      // Search input listener
      document.getElementById('searchInput').addEventListener('input', searchExamples);

      // Scroll listener for sidebar
      window.addEventListener('scroll', updateSidebarActive);

      // Tab button listeners
      document.querySelectorAll('.tab-buttons button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const card = e.target.closest('.example-card');
          const lang = e.target.classList[0].replace('tab-btn-', '');
          switchTab(card, lang);
        });
      });

      // Smooth scroll for sidebar links
      document.querySelectorAll('.category-item a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('href').substring(1);
          const targetSection = document.getElementById(targetId);
          if (targetSection) {
            targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
    });
  </script>
