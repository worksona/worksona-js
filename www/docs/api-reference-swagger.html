<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksona.js API Reference</title>
  <meta name="description" content="Interactive API documentation for Worksona.js - AI Agent Management API with multi-provider support">

  <link rel="stylesheet" href="/assets/css/worksona-branding.css">
  <link rel="stylesheet" href="/assets/css/navigation.css">

  <!-- Swagger UI CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui.css">

  <style>
    :root {
  --primary: #2563eb;
  --secondary: #7c3aed;
  --success: #10b981;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;

      --bg-light: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent-blue: #2563eb;
      --accent-purple: #7c3aed;
      --accent-pink: #10b981;
      --border-color: #0f172a;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: white;
      color: var(--gray-900);
    ;}

.header {
      background: var(--primary);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    ;}

.header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--primary);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    ;}

.header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
      font-weight: 700;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    ;}

.header p {
      margin: 0;
      font-size: 1.2rem;
      opacity: 0.95;
      position: relative;
      z-index: 1;
    ;}







    #swagger-ui {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
      background: white;
      margin-top: 60px;
    }

    /* Custom Swagger UI theme */
    .swagger-ui {
      /* Removed dark mode filter for better visibility */
    ;}

.swagger-ui .topbar {
      display: none;
    ;}

.swagger-ui .info {
      margin: 2rem 0;
      background: white;
      padding: 2rem;
      
      border: 1px solid var(--border-color);
    ;}

.swagger-ui .info .title {
      font-size: 2.5rem;
      color: var(--accent-blue);
    ;}

.swagger-ui .scheme-container {
      background: white;
      padding: 1.5rem;
      
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
    ;}

.swagger-ui .opblock .opblock-summary-method {
      
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    ;}

.swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: var(--primary);
    ;}

.swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: var(--primary);
    ;}

.swagger-ui .opblock.opblock-delete .opblock-summary-method {
      background: var(--primary);
    ;}

.swagger-ui .opblock {
      
      border: 1px solid var(--border-color);
      margin: 1.5rem 0;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    ;}

.swagger-ui .opblock:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
      transform: translateY(-2px);
    ;}

.swagger-ui .btn.execute {
      background: var(--primary);
      border: none;
      
      font-weight: 600;
      padding: 0.75rem 2rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    ;}

.swagger-ui .btn.execute:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    /* Server status indicator */
    .server-status {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: white;
      padding: 0.75rem 1.5rem;
      
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1000;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      color: var(--gray-900);
    ;}

.server-status .status-dot {
      width: 10px;
      height: 10px;
      
      animation: pulse 2s infinite;
      box-shadow: 0 0 10px currentColor;
    ;}

.server-status.online .status-dot {
      background: #10b981;
      color: #10b981;
    ;}

.server-status.offline .status-dot {
      background: #ef4444;
      color: #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 1;
        transform: scale(1);
      }
      50% { 
        opacity: 0.6;
        transform: scale(1.1);
      }
    }

    /* Footer */
    .footer {
      background: var(--primary);
      color: var(--gray-900);
      padding: 3rem 2rem;
      text-align: center;
      margin-top: 4rem;
      border-top: 1px solid var(--border-color);
    ;}

.footer a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: all 0.2s ease;
    ;}

.footer a:hover {
      color: var(--accent-purple);
      text-decoration: underline;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 2rem 1rem;
      ;}

.header h1 {
        font-size: 1.75rem;
      ;}

.header p {
        font-size: 1rem;
      ;}





.server-status {
        top: auto;
        bottom: 1rem;
        right: 1rem;
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
      }

      #swagger-ui {
        padding: 1rem;
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: white;
    }

    ::-webkit-scrollbar-thumb {
      background: white;
      
      border: 2px solid var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--bg-card-hover);
    }
  </style>
</head>
<body>
<div class="worksona-content">
  <!-- Header -->
  <div class="header">
    <h1> Worksona.js API Reference</h1>
    <p>Interactive API documentation with try-it-now functionality</p>
    
  </div>

  <!-- Server Status Indicator -->
  <div class="server-status offline" id="serverStatus">
    <div class="status-dot"></div>
    <span id="statusText">Checking server...</span>
  </div>

  <!-- Swagger UI -->
  <div id="swagger-ui"></div>

  <!-- Footer -->
  <div class="footer">
    <p>
      <strong>Worksona.js</strong> - AI Agent Management Library & API Server
    </p>
    <p style="margin-top: 0.5rem; opacity: 0.8;">
      <a href="https://github.com/worksona/worksona-js">GitHub</a> 
      <a href="https://www.npmjs.com/package/worksona-js">NPM</a> 
      <a href="./index.html">Documentation</a> 
      <a href="../marketing/index.html">About</a>
    </p>
    <p style="margin-top: 1rem; opacity: 0.6; font-size: 0.875rem;">
      MIT Licensed  Version 0.3.0
    </p>
  </div>

  <!-- Swagger UI Bundle -->
  <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-standalone-preset.js"></script>

  <script>
    // Check server status
    async function checkServerStatus() {
      const statusEl = document.getElementById('serverStatus');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('http://localhost:3000/health');
        if (response.ok) {
          statusEl.className = 'server-status online';
          statusText.textContent = 'Server online';
        } else {
          statusEl.className = 'server-status offline';
          statusText.textContent = 'Server error';
        }
      } catch (error) {
        statusEl.className = 'server-status offline';
        statusText.textContent = 'Server offline';
      }
    }

    // Check status on load and periodically
    checkServerStatus();
    setInterval(checkServerStatus, 30000); // Check every 30 seconds

    // Initialize Swagger UI
    document.addEventListener('DOMContentLoaded', function() {
      const ui = SwaggerUIBundle({
        url: '/docs/openapi-spec.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        displayRequestDuration: true,
        tryItOutEnabled: true,
        filter: true,
        syntaxHighlight: {
          activate: true,
          theme: 'monokai'
        },
        requestInterceptor: (req) => {
          // Add custom headers if needed
          // req.headers['X-Custom-Header'] = 'value';
          return req;
        },
        responseInterceptor: (res) => {
          // Log responses if needed
          console.log('API Response:', res.status, res.url);
          return res;
        }
      });

      window.ui = ui;
    });
  </script>
  <script src="/assets/js/navigation.js"></script>
</div>
</body>
</html>
