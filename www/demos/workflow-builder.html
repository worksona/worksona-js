<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Workflow Builder - Worksona.js</title>
  <meta name="description" content="Drag-and-drop visual workflow builder for creating multi-agent AI workflows">

  <link rel="stylesheet" href="/assets/css/worksona-branding.css">
  <link rel="stylesheet" href="/assets/css/navigation.css">

  <!-- React Flow CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --secondary: #7c3aed;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    /* React Flow overrides */
    .react-flow__node {
      cursor: grab;
    }

    .react-flow__node.selected {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .react-flow__edge.selected .react-flow__edge-path {
      stroke: var(--primary);
      stroke-width: 2;
    }

    .react-flow__controls {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .react-flow__minimap {
      background: white;
      border: 1px solid var(--gray-200);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./workflow-builder.jsx"></script>
</body>
</html>
