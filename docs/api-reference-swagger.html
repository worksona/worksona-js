<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksona.js API Reference</title>
  <meta name="description" content="Interactive API documentation for Worksona.js - AI Agent Management API with multi-provider support">

  <!-- Swagger UI CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .header {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .header-links {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .header-links a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .header-links a:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    #swagger-ui {
      max-width: 1440px;
      margin: 0 auto;
    }

    /* Custom Swagger UI theme */
    .swagger-ui .topbar {
      display: none;
    }

    .swagger-ui .info {
      margin: 2rem 0;
    }

    .swagger-ui .info .title {
      font-size: 2.5rem;
      color: #2563eb;
    }

    .swagger-ui .scheme-container {
      background: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: none;
      border: 1px solid #e2e8f0;
    }

    .swagger-ui .opblock .opblock-summary-method {
      border-radius: 6px;
      font-weight: 600;
    }

    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #10b981;
    }

    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #2563eb;
    }

    .swagger-ui .opblock.opblock-delete .opblock-summary-method {
      background: #ef4444;
    }

    .swagger-ui .opblock {
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin: 1rem 0;
    }

    .swagger-ui .btn.execute {
      background: #2563eb;
      border-color: #2563eb;
      border-radius: 6px;
      font-weight: 600;
    }

    .swagger-ui .btn.execute:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    /* Server status indicator */
    .server-status {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: white;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1000;
      font-size: 0.9rem;
    }

    .server-status .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .server-status.online .status-dot {
      background: #10b981;
    }

    .server-status.offline .status-dot {
      background: #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Footer */
    .footer {
      background: #0f172a;
      color: white;
      padding: 2rem;
      text-align: center;
      margin-top: 4rem;
    }

    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .header p {
        font-size: 1rem;
      }

      .header-links {
        flex-direction: column;
        align-items: center;
      }

      .server-status {
        top: auto;
        bottom: 1rem;
        right: 1rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>🤖 Worksona.js API Reference</h1>
    <p>Interactive API documentation with try-it-now functionality</p>
    <div class="header-links">
      <a href="./index.html">← Documentation Hub</a>
      <a href="./endpoint-api-demo.html">API Demo</a>
      <a href="./code-examples-hub.html">Code Examples</a>
      <a href="https://github.com/worksona/worksona-js" target="_blank">GitHub ↗</a>
      <a href="https://www.npmjs.com/package/worksona-js" target="_blank">NPM ↗</a>
    </div>
  </div>

  <!-- Server Status Indicator -->
  <div class="server-status offline" id="serverStatus">
    <div class="status-dot"></div>
    <span id="statusText">Checking server...</span>
  </div>

  <!-- Swagger UI -->
  <div id="swagger-ui"></div>

  <!-- Footer -->
  <div class="footer">
    <p>
      <strong>Worksona.js</strong> - AI Agent Management Library & API Server
    </p>
    <p style="margin-top: 0.5rem; opacity: 0.8;">
      <a href="https://github.com/worksona/worksona-js">GitHub</a> •
      <a href="https://www.npmjs.com/package/worksona-js">NPM</a> •
      <a href="./index.html">Documentation</a> •
      <a href="../marketing/index.html">About</a>
    </p>
    <p style="margin-top: 1rem; opacity: 0.6; font-size: 0.875rem;">
      MIT Licensed • Version 0.3.0
    </p>
  </div>

  <!-- Swagger UI Bundle -->
  <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-standalone-preset.js"></script>

  <script>
    // Check server status
    async function checkServerStatus() {
      const statusEl = document.getElementById('serverStatus');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('http://localhost:3000/health');
        if (response.ok) {
          statusEl.className = 'server-status online';
          statusText.textContent = 'Server online';
        } else {
          statusEl.className = 'server-status offline';
          statusText.textContent = 'Server error';
        }
      } catch (error) {
        statusEl.className = 'server-status offline';
        statusText.textContent = 'Server offline';
      }
    }

    // Check status on load and periodically
    checkServerStatus();
    setInterval(checkServerStatus, 30000); // Check every 30 seconds

    // Initialize Swagger UI
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: './openapi-spec.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        displayRequestDuration: true,
        tryItOutEnabled: true,
        filter: true,
        syntaxHighlight: {
          activate: true,
          theme: 'monokai'
        },
        requestInterceptor: (req) => {
          // Add custom headers if needed
          // req.headers['X-Custom-Header'] = 'value';
          return req;
        },
        responseInterceptor: (res) => {
          // Log responses if needed
          console.log('API Response:', res.status, res.url);
          return res;
        }
      });

      window.ui = ui;
    };
  </script>
</body>
</html>
